openapi: 3.0.3
info:
  title: 在线笔记平台 API
  version: 1.1.0
  description: |
    当前文档只描述已经实现并可调用的后端 HTTP API。
    - 统一响应包：`{ code, message, data, requestId, timestamp }`
    - 鉴权：`Authorization: Bearer <JWT>`
    - 未实现但有长期价值的接口记录在 `docs/api-contract-drift.md` 的 Planned APIs
servers:
  - url: http://localhost:3001
    description: 本地开发
tags:
  - name: Health
    description: 服务健康检查
  - name: Auth
    description: 注册、登录与当前用户
  - name: AI
    description: AI gateway endpoints for writing, summaries, diagrams, and chat
  - name: Notes
    description: 笔记 CRUD、搜索、推荐、ACL 与锁定
  - name: Comments
    description: 笔记评论与回复
  - name: Versions
    description: 笔记版本快照与恢复
  - name: Categories
    description: 分类管理
  - name: Tags
    description: 标签管理
  - name: Boards
    description: 画板资源
  - name: Mindmaps
    description: 思维导图资源
  - name: Semantic
    description: 语义搜索与主题聚类
  - name: Invitations
    description: 笔记邀请协作
  - name: SavedFilters
    description: 保存筛选器
  - name: KnowledgeBases
    description: 知识库边界与笔记归属
  - name: Dashboard
    description: 仪表盘概览
  - name: Audit
    description: 审计日志
  - name: Notifications
    description: 通知中心
  - name: RUM
    description: 前端运行时指标采集
paths:
  /api/health:
    get:
      tags: [Health]
      summary: 健康检查
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/ai/writer:
    post:
      tags: [AI]
      summary: Generate AI writing text
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AiWriterInput'
      responses:
        '201':
          $ref: '#/components/responses/AiWriterEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/ai/writer/stream:
    post:
      tags: [AI]
      summary: Stream AI writing text
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AiWriterInput'
      responses:
        '200':
          description: Plain text chunks streamed as server-sent text
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/ai/mindmap:
    post:
      tags: [AI]
      summary: Generate, expand, or optimize mind map data
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AiMindmapInput'
      responses:
        '201':
          $ref: '#/components/responses/AiMessagesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/ai/mermaid:
    post:
      tags: [AI]
      summary: Generate Mermaid diagram code
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AiMermaidInput'
      responses:
        '201':
          $ref: '#/components/responses/AiMessagesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/ai/knowledge-graph/proposal:
    post:
      tags: [AI]
      summary: Build a knowledge graph proposal for one knowledge base
      description: 手动触发单个知识库的图谱 proposal 构建；只返回建议，不写入核心图谱数据。
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AiKnowledgeGraphInput'
      responses:
        '201':
          $ref: '#/components/responses/AiKnowledgeGraphProposalEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/ai/pet:
    post:
      tags: [AI]
      summary: Stream text-only AI pet chat
      description: The current provider route supports text chat only. Image chat returns 400.
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AiPetInput'
      responses:
        '200':
          description: Plain text chunks streamed as server-sent text
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/ai/summary:
    post:
      tags: [AI]
      summary: Generate an aggregate summary for selected notes
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AiSummaryInput'
      responses:
        '201':
          $ref: '#/components/responses/AiSummaryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/register:
    post:
      tags: [Auth]
      summary: 注册用户
      requestBody:
        $ref: '#/components/requestBodies/AuthCredentials'
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: 登录
      requestBody:
        $ref: '#/components/requestBodies/AuthCredentials'
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录并清除认证 Cookie
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/auth/me:
    get:
      tags: [Auth]
      summary: 当前用户
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/notes:
    get:
      tags: [Notes]
      summary: 笔记列表
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/CategoryIds'
        - $ref: '#/components/parameters/TagIds'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: 笔记分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedNotes'
    post:
      tags: [Notes]
      summary: 创建笔记
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/NoteInput'
      responses:
        '201':
          $ref: '#/components/responses/NoteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/notes/recommendations:
    get:
      tags: [Notes]
      summary: 推荐笔记
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: currentNoteId
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 5 }
      responses:
        '200':
          description: 推荐笔记列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Note'
  /api/notes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Notes]
      summary: 笔记详情
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/NoteEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Notes]
      summary: 部分更新笔记
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/NoteInput'
      responses:
        '200':
          $ref: '#/components/responses/NoteEnvelope'
    put:
      tags: [Notes]
      summary: 更新笔记
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/NoteInput'
      responses:
        '200':
          $ref: '#/components/responses/NoteEnvelope'
    delete:
      tags: [Notes]
      summary: 删除笔记
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/notes/{id}/acl:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Notes]
      summary: 读取笔记 ACL
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AclEnvelope'
    post:
      tags: [Notes]
      summary: 添加协作者
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AclInput'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/notes/{id}/acl/{userId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Notes]
      summary: 更新协作者角色
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AclRoleInput'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      tags: [Notes]
      summary: 移除协作者
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/notes/{id}/room-ticket:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Notes]
      summary: 签发笔记协作房间短时票据
      security:
        - BearerAuth: []
      responses:
        '201':
          $ref: '#/components/responses/RoomTicketEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/notes/{id}/lock:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Notes]
      summary: 锁定笔记
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      tags: [Notes]
      summary: 解锁笔记
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/notes/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Comments]
      summary: 评论列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 评论列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Comment'
    post:
      tags: [Comments]
      summary: 创建评论
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CommentInput'
      responses:
        '201':
          $ref: '#/components/responses/CommentEnvelope'
  /api/comments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Comments]
      summary: 删除评论
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/comments/{id}/replies:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Comments]
      summary: 回复评论
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        '201':
          $ref: '#/components/responses/CommentEnvelope'
  /api/notes/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Versions]
      summary: 版本列表
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [Versions]
      summary: 创建版本快照
      security:
        - BearerAuth: []
      responses:
        '201':
          $ref: '#/components/responses/Ok'
  /api/notes/{id}/versions/{versionNo}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
      - in: path
        name: versionNo
        required: true
        schema: { type: integer }
    post:
      tags: [Versions]
      summary: 恢复版本
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/categories:
    get:
      tags: [Categories]
      summary: 分类列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 分类列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: 创建分类
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CategoryInput'
      responses:
        '201':
          $ref: '#/components/responses/CategoryEnvelope'
  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Categories]
      summary: 分类详情
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/CategoryEnvelope'
    patch:
      tags: [Categories]
      summary: 更新分类
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CategoryInput'
      responses:
        '200':
          $ref: '#/components/responses/CategoryEnvelope'
    delete:
      tags: [Categories]
      summary: 删除分类
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/tags:
    get:
      tags: [Tags]
      summary: 标签列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tag'
    post:
      tags: [Tags]
      summary: 创建标签
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TagInput'
      responses:
        '201':
          $ref: '#/components/responses/TagEnvelope'
  /api/tags/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tags]
      summary: 标签详情
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/TagEnvelope'
    patch:
      tags: [Tags]
      summary: 更新标签
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TagInput'
      responses:
        '200':
          $ref: '#/components/responses/TagEnvelope'
    delete:
      tags: [Tags]
      summary: 删除标签
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/tags/bulk:
    post:
      tags: [Tags]
      summary: 批量创建标签
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names:
                  type: array
                  items: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/tags/merge:
    post:
      tags: [Tags]
      summary: 合并标签
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceIds, targetId]
              properties:
                sourceIds:
                  type: array
                  items: { type: string }
                targetId: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/tags/sync:
    post:
      tags: [Tags]
      summary: 同步标签计数
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/v1/boards:
    post:
      tags: [Boards]
      summary: 创建画板
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ResourceInput'
      responses:
        '201':
          $ref: '#/components/responses/ResourceEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/boards/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Boards]
      summary: 画板详情
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ResourceEnvelope'
    put:
      tags: [Boards]
      summary: 更新画板
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ResourceInput'
      responses:
        '200':
          $ref: '#/components/responses/ResourceEnvelope'
  /api/v1/mindmaps:
    post:
      tags: [Mindmaps]
      summary: 创建思维导图
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ResourceInput'
      responses:
        '201':
          $ref: '#/components/responses/ResourceEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/mindmaps/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Mindmaps]
      summary: 思维导图详情
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ResourceEnvelope'
    put:
      tags: [Mindmaps]
      summary: 更新思维导图
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ResourceInput'
      responses:
        '200':
          $ref: '#/components/responses/ResourceEnvelope'
  /api/v1/semantic/search:
    get:
      tags: [Semantic]
      summary: 语义搜索
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: mode
          schema: { type: string, enum: [keyword, vector, hybrid], default: hybrid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/TagIds'
      responses:
        '200':
          description: 语义搜索结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SemanticPage'
  /api/v1/semantic/topics:
    get:
      tags: [Semantic]
      summary: 主题列表
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/v1/semantic/topics/convert:
    post:
      tags: [Semantic]
      summary: 主题转标签
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topicName, noteIds]
              properties:
                topicName: { type: string }
                noteIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/invitations/notes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Invitations]
      summary: 笔记邀请列表
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [Invitations]
      summary: 创建邀请
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [editor, viewer] }
                inviteeEmail: { type: string }
                ttlHours: { type: integer }
      responses:
        '201':
          $ref: '#/components/responses/Ok'
  /api/invitations/mine:
    get:
      tags: [Invitations]
      summary: 我的邀请
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/invitations/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
    get:
      tags: [Invitations]
      summary: 邀请预览
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      tags: [Invitations]
      summary: 撤销邀请
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/invitations/{token}/accept:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
    post:
      tags: [Invitations]
      summary: 接受邀请
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/saved-filters:
    get:
      tags: [SavedFilters]
      summary: 保存筛选器列表
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [SavedFilters]
      summary: 创建保存筛选器
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFilter'
      responses:
        '201':
          $ref: '#/components/responses/Ok'
  /api/saved-filters/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [SavedFilters]
      summary: 删除保存筛选器
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/knowledge-bases:
    get:
      tags: [KnowledgeBases]
      summary: 知识库列表
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeBaseListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [KnowledgeBases]
      summary: 创建知识库
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/KnowledgeBaseInput'
      responses:
        '201':
          $ref: '#/components/responses/KnowledgeBaseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/knowledge-bases/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [KnowledgeBases]
      summary: 更新知识库
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/KnowledgeBaseUpdateInput'
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeBaseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [KnowledgeBases]
      summary: 删除知识库
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/knowledge-bases/{id}/notes:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [KnowledgeBases]
      summary: 知识库笔记列表
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeBaseNoteListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [KnowledgeBases]
      summary: 加入笔记到知识库
      description: 只能加入当前用户可读的笔记，避免知识图谱跨知识库或跨权限混入。
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/KnowledgeBaseNoteInput'
      responses:
        '201':
          $ref: '#/components/responses/KnowledgeBaseNoteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/knowledge-bases/{id}/graph:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [KnowledgeBases]
      summary: 获取知识库图谱
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeGraphEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [KnowledgeBases]
      summary: 保存知识库图谱
      description: 按当前用户和知识库边界替换图谱，只保留知识库内笔记引用。
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/KnowledgeGraphInput'
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeGraphEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/knowledge-bases/{id}/notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - in: path
        name: noteId
        required: true
        schema: { type: string }
    delete:
      tags: [KnowledgeBases]
      summary: 从知识库移除笔记
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/dashboard/overview:
    get:
      tags: [Dashboard]
      summary: 仪表盘概览
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/audit/logs:
    get:
      tags: [Audit]
      summary: 审计日志
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - in: query
          name: resourceType
          schema: { type: string }
        - in: query
          name: resourceId
          schema: { type: string }
        - in: query
          name: eventType
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/notifications:
    get:
      tags: [Notifications]
      summary: 通知列表
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Notifications]
      summary: 标记通知已读
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/rum/collect:
    post:
      tags: [RUM]
      summary: 采集前端运行时指标
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RumEvent'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/rum/report:
    get:
      tags: [RUM]
      summary: RUM 报告
      parameters:
        - in: query
          name: date
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string }
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      in: query
      name: size
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100 }
    Keyword:
      in: query
      name: keyword
      schema: { type: string }
    CategoryId:
      in: query
      name: categoryId
      schema: { type: string }
    CategoryIds:
      in: query
      name: categoryIds
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
    TagIds:
      in: query
      name: tagIds
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
    Status:
      in: query
      name: status
      schema: { type: string, enum: [published, draft] }
  requestBodies:
    AuthCredentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email }
              password: { type: string }
              name: { type: string }
    NoteInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoteInput'
    CategoryInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Category'
    TagInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Tag'
    AclInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [userId, role]
            properties:
              userId: { type: string }
              role: { type: string, enum: [editor, viewer] }
    AclRoleInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [role]
            properties:
              role: { type: string, enum: [owner, editor, viewer] }
    CommentInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              start: { type: integer }
              end: { type: integer }
              text: { type: string }
              anchor: { type: object }
              blockId: { type: string }
    ResourceInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceInput'
    AiWriterInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiWriterInput'
    AiMindmapInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiMindmapInput'
    AiMermaidInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiMermaidInput'
    AiKnowledgeGraphInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiKnowledgeGraphInput'
    AiPetInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiPetInput'
    AiSummaryInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiSummaryInput'
    KnowledgeBaseInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeBaseInput'
    KnowledgeBaseUpdateInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeBaseUpdateInput'
    KnowledgeBaseNoteInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [noteId]
            properties:
              noteId: { type: string }
    KnowledgeGraphInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeGraphInput'
  responses:
    Ok:
      description: 成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    AuthSession:
      description: 登录态
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
    UserEnvelope:
      description: 用户
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
    NoteEnvelope:
      description: 笔记
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
    RoomTicketEnvelope:
      description: 协作房间短时票据
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RoomTicket'
    CategoryEnvelope:
      description: 分类
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
    TagEnvelope:
      description: 标签
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tag'
    AclEnvelope:
      description: ACL
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      visibility: { type: string }
                      acl:
                        type: array
                        items:
                          $ref: '#/components/schemas/AclEntry'
    CommentEnvelope:
      description: 评论
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Comment'
    ResourceEnvelope:
      description: 资源
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Resource'
    AiWriterEnvelope:
      description: AI writing result
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiWriterOutput'
    AiMessagesEnvelope:
      description: AI legacy message wrapper
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiMessagesOutput'
    AiSummaryEnvelope:
      description: AI summary result
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiSummaryOutput'
    AiKnowledgeGraphProposalEnvelope:
      description: 知识图谱 proposal
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/KnowledgeGraphProposal'
    KnowledgeGraphEnvelope:
      description: 知识库图谱
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/KnowledgeGraphProposal'
    KnowledgeBaseEnvelope:
      description: 知识库
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/KnowledgeBase'
    KnowledgeBaseListEnvelope:
      description: 知识库列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KnowledgeBase'
    KnowledgeBaseNoteEnvelope:
      description: 知识库笔记关联
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/KnowledgeBaseNote'
    KnowledgeBaseNoteListEnvelope:
      description: 知识库笔记列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KnowledgeBaseNote'
    BadRequest:
      description: 请求错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    NotFound:
      description: 不存在或无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
  schemas:
    ApiEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: OK }
        data: {}
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string }
        _id: { type: string }
        email: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthSession:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: '#/components/schemas/User'
    NoteInput:
      type: object
      properties:
        title: { type: string }
        content: { type: string }
        categoryId: { type: string }
        categoryIds:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [published, draft] }
    Note:
      allOf:
        - $ref: '#/components/schemas/NoteInput'
        - type: object
          properties:
            id: { type: string }
            _id: { type: string }
            summary: { type: string }
            userId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    RoomTicket:
      type: object
      required: [ticket, role, expiresIn]
      properties:
        ticket:
          type: string
          description: 仅用于指定笔记 Yjs 房间的短时 JWT
        role:
          type: string
          enum: [writer, reader]
        expiresIn:
          type: integer
          description: 有效期，单位为秒
          example: 300
    PaginatedNotes:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
        nextCursor: { type: string }
    Category:
      type: object
      properties:
        id: { type: string }
        _id: { type: string }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        parentId: { type: string, nullable: true }
        noteCount: { type: integer }
    Tag:
      type: object
      properties:
        id: { type: string }
        _id: { type: string }
        name: { type: string }
        color: { type: string }
        noteCount: { type: integer }
    AclEntry:
      type: object
      properties:
        userId: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
        addedBy: { type: string }
        addedAt: { type: string, format: date-time }
    Comment:
      type: object
      properties:
        id: { type: string }
        noteId: { type: string }
        text: { type: string }
        replies:
          type: array
          items: { type: object }
    ResourceInput:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        noteId: { type: string }
        content: {}
    Resource:
      allOf:
        - $ref: '#/components/schemas/ResourceInput'
        - type: object
          properties:
            id: { type: string }
    SemanticPage:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNext: { type: boolean }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              preview: { type: string }
              score: { type: number }
              updatedAt: { type: string }
    AiWriterInput:
      type: object
      required: [context, type]
      properties:
        prompt: { type: string }
        context: { type: string }
        type: { type: string, enum: [continue, polish, summary] }
    AiWriterOutput:
      type: object
      properties:
        text: { type: string }
    AiMindmapInput:
      type: object
      required: [content]
      properties:
        content: {}
        scenario: { type: string, enum: [generate, expand, optimize], default: generate }
    AiMermaidInput:
      type: object
      required: [content]
      properties:
        content: { type: string }
        availableIcons:
          type: array
          items: { type: string }
    AiPetInput:
      type: object
      required: [message]
      properties:
        message: { type: string }
        conversationId: { type: string }
    AiSummaryInput:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AiSummaryNoteInput'
    AiSummaryNoteInput:
      type: object
      additionalProperties: true
      properties:
        title: { type: string }
        content: { type: string }
        updatedAt: { type: string, format: date-time }
    AiLegacyMessage:
      type: object
      required: [role, type, content]
      properties:
        role: { type: string, example: assistant }
        type: { type: string, example: answer }
        content: { type: string }
    AiMessagesOutput:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AiLegacyMessage'
    AiSummaryOutput:
      type: object
      properties:
        summary: { type: string }
    AiKnowledgeGraphInput:
      type: object
      required: [knowledgeBaseId]
      properties:
        knowledgeBaseId: { type: string }
    KnowledgeGraphInput:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeGraphProposalNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeGraphProposalEdge'
    KnowledgeGraphProposal:
      type: object
      properties:
        knowledgeBaseId: { type: string }
        generatedAt: { type: string, format: date-time }
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeGraphProposalNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeGraphProposalEdge'
        warnings:
          type: array
          items: { type: string }
    KnowledgeGraphProposalNode:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string, enum: [concept, entity, topic, claim] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        noteIds:
          type: array
          items: { type: string }
    KnowledgeGraphProposalEdge:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        relation: { type: string }
        weight: { type: number, minimum: 0, maximum: 1 }
        noteIds:
          type: array
          items: { type: string }
    SavedFilter:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        criteria: { type: object }
    KnowledgeBaseInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
    KnowledgeBaseUpdateInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
    KnowledgeBase:
      allOf:
        - $ref: '#/components/schemas/KnowledgeBaseInput'
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    KnowledgeBaseNote:
      type: object
      properties:
        id: { type: string }
        knowledgeBaseId: { type: string }
        noteId: { type: string }
        note:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            summary: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    RumEvent:
      type: object
      properties:
        type: { type: string }
        name: { type: string }
        value: { type: number }
        meta: { type: object }
        ts: { type: number }
