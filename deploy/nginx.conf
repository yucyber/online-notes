events {}
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  # room ticket 位于 query，访问日志不记录完整请求 URL。
  log_format safe '$remote_addr $request_method $uri $status';
  access_log /var/log/nginx/access.log safe;
  server {
    listen 80;
    server_name 47.97.243.59;
    return 301 https://47.97.243.59$request_uri;
  }
  server {
    listen 443 ssl;
    server_name 47.97.243.59;
    ssl_certificate /etc/letsencrypt/live/47.97.243.59/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.97.243.59/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
    location = /gateway-health { access_log off; return 200 'okay'; }
    # Next route handler 负责 Cookie 转 Bearer 和响应信封解包。
    location ~ ^/api/(assistant(/|$)|ai/(writer|pet|mindmap|mermaid|summary)/?$) {
      proxy_pass http://frontend:3000;
    }
    location /api/ { proxy_pass http://backend:3001; }
    # y-websocket 以路径识别房间；剥离网关前缀使 room 名保持不变。
    location /ws/yjs/ {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://y-websocket:1234/;
    }
    location / { proxy_pass http://frontend:3000; }
  }
}
